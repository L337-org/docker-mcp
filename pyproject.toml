[project]
name = "docker-mcp-server"
version = "2.2.3"
description = "MCP server for managing Docker resources via the Docker SDK for Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Gavin Lucas" }]
keywords = ["docker", "mcp", "model-context-protocol", "containers", "compose", "swarm", "devops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dependencies = [
    # [ssh] pulls paramiko so `ssh://` DOCKER_HOST works through the pure-Python transport — no
    # system `ssh` binary, so it works identically on the host and inside the container images.
    "docker[ssh]>=7.1.0",
    "httpx>=0.28.1",
    # server.py imports MCPServer from mcp.server.mcpserver (mcp 2.0.0 removed the 1.x
    # mcp.server.fastmcp.FastMCP surface this used to import). No upper cap: unlike that break,
    # there's no known 3.x incompatibility to guard against, and
    # tests/test_pyproject_pins.py::test_the_declared_mcp_bound_matches_what_the_code_imports
    # already fails CI the day an installed mcp stops providing this import path.
    "mcp>=2.0.0",
    # Pulled in transitively by docker, but we import requests.exceptions directly
    # (container_wait catches ReadTimeout), so declare it explicitly.
    "requests>=2.26.0",
    # Pulled in transitively via mcp -> pyjwt[crypto]. GHSA (Dependabot alert #16, high severity:
    # a PKCS#7 EnvelopedData decryption Bleichenbacher oracle) requires >=50 to fix, but 49.x
    # onward ships no macOS x86_64/universal2 wheel at all (arm64-only) — confirmed against every
    # release through 50.0.0, so this isn't transient. On Intel macOS the resolver falls back to a
    # source build, needing Rust (cryptography's build backend is `maturin`) and OpenSSL 3.0+
    # (support for 1.1.x was dropped). Previously capped at <49 to keep Intel-macOS installs
    # wheel-only, but that leaves every platform on the vulnerable 48.x line (see README's Security
    # considerations for why "scoped to one platform" didn't actually work: a lone upper-bound
    # marker doesn't force uv to fork the resolution, so the whole lockfile stayed on 48.x).
    # Deliberately staying on a known, fixed floor rather than risking silently-vulnerable code:
    # Intel macOS installs now require Rust + OpenSSL 3.x (README documents this and the
    # container-image alternative, which needs neither). Guarded by
    # tests/test_pyproject_pins.py::test_cryptography_floor_is_not_capped_below_the_fix.
    "cryptography>=50",
]

[project.scripts]
docker-mcp = "docker_mcp:main"
docker-mcp-server = "docker_mcp:main"

[project.urls]
Homepage = "https://github.com/L337-org/docker-mcp"
Repository = "https://github.com/L337-org/docker-mcp"
Issues = "https://github.com/L337-org/docker-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["docker_mcp"]

[tool.uv]
# Security pin: urllib3 < 2.7.0 has multiple CVEs. Pulled in transitively
# via docker -> requests. Bump when a newer fix is available.
constraint-dependencies = ["urllib3>=2.7.0"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes (ruff defaults), B = flake8-bugbear, S = flake8-bandit
# (security; gives the S603/S310 noqas in _cli.py / resources.py teeth), UP = pyupgrade.
select = ["E", "F", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
# Tests legitimately use assert (S101), hardcoded fixture secrets (S105/S106),
# and /tmp paths as plain string fixtures, not real file operations (S108).
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.pyright]
include = ["docker_mcp", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a real Docker daemon (run with `uv run pytest -m integration`)",
]
addopts = "-m 'not integration'"

[dependency-groups]
dev = [
    # Pulled in transitively by pytest, but tests/test_pyproject_pins.py parses PEP 508 requirement
    # strings with it directly, so declare it — the same reasoning as `requests` above.
    "packaging>=24.0",
    "pytest>=9.0.3",
    "pyright>=1.1.409",
    "ruff>=0.15.12",
    "pre-commit>=4.6.0",
]
