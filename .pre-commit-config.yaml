# Installed with `uv run pre-commit install` (CONTRIBUTING.md). Local hooks through `uv run`, not the
# ruff-pre-commit repo, so the hook runs the ruff version uv.lock resolves for the dev group - the same
# one CI's ruff job runs - rather than a second pin that can drift from it.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
