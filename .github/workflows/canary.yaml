name: Weekly canary

# Proactive platform/ecosystem drift detection — the class of breakage premerge CI (ubuntu +
# CPython 3.14 only) can't see:
#
#   1. resolve-crossplatform (ubuntu, no mac/windows hardware needed): wheels-only dependency
#      resolution for Intel macOS, Apple-silicon macOS, and Windows — against BOTH the repo's
#      pyproject.toml (would the next release install?) and the latest published PyPI release
#      (did an upstream dep pull its wheels out from under an already-shipped version?). This is
#      exactly the check that would have caught cryptography 49 dropping its x86_64-macOS wheel.
#   2. install-smoke (real runners): install the published package with uv and import/run it on
#      macos-latest (arm64), macos-15-intel (x86_64), and windows-latest, then install and start
#      the newest release's .mcpb the way Claude Desktop launches it. The bundle installs from its
#      own uv.lock on the user's machine, so it breaks differently from a fresh uvx resolve: a
#      locked file pulled from PyPI, a locked version with no wheel for that platform or for a newer
#      CPython, or a change in the host's uv.
#   3. image-smoke: pull and start both published images, :latest and :no-scout, and check each
#      reports the newest release.
#
# On failure the notify job files (or comments on) a deduplicated issue labeled
# ci-failure + wf:canary — one open issue per stream, so four red Mondays make one thread.
#
# PRs into main also run the repo-pyproject resolution leg — the only part that exercises the
# PR's own changes — so a dependency edit that breaks a platform is caught before merge, not the
# following Monday. The published-package legs (PyPI-release resolution, install and image smokes) and the
# issue filing stay schedule/dispatch-only: on a PR they would re-test the already-shipped
# release and could block a merge on breakage the PR didn't cause.

permissions:
  contents: read

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:

  resolve-crossplatform:
    name: Cross-platform wheel resolution
    runs-on: ubuntu-latest
    # 0.1 min observed max - a dependency resolve, no build.
    timeout-minutes: 10
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Pinned (matching the Dockerfile's uv image tag) so this step never needs the
          # live "resolve latest" fetch to raw.githubusercontent.com — that network call
          # failed transiently on 2026-07-06 and blocked an unrelated PR (#130).
          version: "0.11.21"

      - name: Resolve runtime deps as wheels-only for each platform
        # --only-binary :all: makes resolution fail if any dependency lacks a wheel for the
        # target platform — a source-build fallback is exactly the breakage this hunts (users
        # without a Rust/C toolchain). pyproject.toml resolution covers [project].dependencies
        # only (the uvx install surface, not dev groups). If a deliberately sdist-only dep ever
        # enters the tree, exempt it per-package rather than dropping :all:.
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            latest="$(curl -fsSL --max-time 30 --retry 3 https://pypi.org/pypi/docker-mcp-server/json | jq -r .info.version)"
            echo "Latest published release: $latest"
          fi
          failed=0
          for target in x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            echo "::group::$target (repo pyproject.toml)"
            # stdout (the compiled lock) is discarded — only resolution success matters. Don't
            # use `-o /dev/null`: uv writes output atomically via a sibling temp file, which
            # fails inside /dev.
            if ! uv pip compile pyproject.toml --python-platform "$target" --python-version 3.14 \
                --only-binary :all: > /dev/null; then
              echo "::error::wheels-only resolution FAILED for $target against the repo pyproject.toml — the next release would not install there"
              failed=1
            fi
            echo "::endgroup::"
            # The published-release leg tests what's already on PyPI, not this checkout — on a PR
            # it can only fail for reasons the PR didn't cause, so it runs on schedule/dispatch only.
            if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
              echo "::group::$target (published docker-mcp-server==$latest)"
              if ! echo "docker-mcp-server==$latest" | uv pip compile - --python-platform "$target" \
                  --python-version 3.14 --only-binary :all: > /dev/null; then
                echo "::error::wheels-only resolution FAILED for $target against published $latest — an upstream dep dropped wheels under a shipped release"
                failed=1
              fi
              echo "::endgroup::"
            fi
          done
          exit "$failed"

  install-smoke:
    # Real install of the *published* package on each platform's actual runner.
    # macos-15-intel is the last Intel-macOS hosted runner label; GitHub retires it August 2027.
    # When the label disappears, drop that matrix leg — wheel resolution for x86_64-apple-darwin
    # continues in the resolve-crossplatform job above, which needs no Intel hardware.
    # Skipped on PRs: it installs the published release, so it never exercises PR content.
    if: github.event_name != 'pull_request'
    name: Install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 30: macos-15-intel source-builds cryptography (brew install + Rust compile), and may do so twice
    # when the .mcpb's locked version differs from the one uvx resolves.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # This job deliberately has no checkout — it tests the *published* package, not the
          # repo — so disable the repo-keyed cache and the empty-workdir warning it triggers.
          enable-cache: false
          ignore-empty-workdir: true
          # Pinned (matching the Dockerfile's uv image tag) so this step never needs the
          # live "resolve latest" fetch to raw.githubusercontent.com.
          version: "0.11.21"

      - name: Point the build at Homebrew's OpenSSL 3.x (Intel macOS only)
        # macos-15-intel ships OpenSSL 1.1.1w (see actions/runner-images); cryptography >=44
        # dropped OpenSSL 1.1.x support and now requires 3.0+. No x86_64 wheel exists (see
        # resolve-crossplatform above), so this install source-builds — the Rust toolchain is
        # already on the runner, but it still needs a compatible OpenSSL to link against.
        if: matrix.os == 'macos-15-intel'
        run: |
          brew install openssl@3
          prefix="$(brew --prefix openssl@3)"
          echo "OPENSSL_DIR=$prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Import smoke (full tool-registration path, no daemon needed)
        run: uv run --no-project --python 3.14 --with docker-mcp-server python -c "import docker_mcp"

      - name: Entry-point smoke (uvx console script)
        # Requires the published package to have the --version flag (shipped in v1.9.3).
        run: uvx --python 3.14 docker-mcp-server --version

      - name: Download and verify the newest release's .mcpb
        # Runs even when the uvx smoke failed, so a failure report says whether the bundle broke too.
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # No tag: gh downloads from the newest release, the one Claude Desktop users install.
        run: |
          set -euo pipefail
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'docker-mcp-server-*.mcpb*' --dir mcpb
          cd mcpb
          # Whichever of sha256sum and shasum the runner has.
          if command -v sha256sum >/dev/null; then sha256sum -c ./*.sha256; else shasum -a 256 -c ./*.sha256; fi

      - name: Bundle smoke (.mcpb started as Claude Desktop starts it)
        if: ${{ !cancelled() }}
        shell: bash
        # manifest.json's mcp_config runs `uv run --directory <bundle> mcpb_run.py`; this is that
        # command, plus --version so it exits before any daemon contact. The version printed must
        # be the bundle's own, or the resolve picked up something other than the bundle's source.
        run: |
          set -euo pipefail
          bundle="$(ls mcpb/*.mcpb)"
          expected="$(basename "$bundle" .mcpb)"; expected="${expected#docker-mcp-server-}"
          uv run --no-project --python 3.14 python -m zipfile -e "$bundle" bundle
          actual="$(uv run --directory bundle mcpb_run.py --version)"
          # Windows' Python may end the line with a carriage return that $(...) keeps.
          actual="${actual%$'\r'}"
          echo "bundle $expected reports $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::the $expected .mcpb started but reported version $actual"
            exit 1
          fi

  image-smoke:
    # Pulls and starts the published images, so it never exercises PR content.
    if: github.event_name != 'pull_request'
    name: Image smoke (${{ matrix.tag }})
    runs-on: ubuntu-latest
    # One image pull and a start that exits at once.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        tag: [latest, no-scout]
    steps:
      - name: Pull and start the image
        env:
          TAG: ${{ matrix.tag }}
        # Both moving tags must start and report the newest PyPI release: a tag left on an older
        # build, or an image that no longer starts, is what this catches.
        run: |
          set -euo pipefail
          latest="$(curl -fsSL --max-time 30 --retry 3 https://pypi.org/pypi/docker-mcp-server/json | jq -r .info.version)"
          image="ghcr.io/l337-org/docker-mcp-server:$TAG"
          docker pull --quiet "$image"
          actual="$(docker run --rm "$image" --version)"
          echo "$image reports $actual; newest PyPI release is $latest"
          if [ "$actual" != "$latest" ]; then
            echo "::error::$image reports version $actual, not the newest release $latest"
            exit 1
          fi

  notify:
    name: File failure issue
    runs-on: ubuntu-latest
    # Files or updates a single issue.
    timeout-minutes: 10
    needs: [resolve-crossplatform, install-smoke, image-smoke]
    # PR failures are visible on the PR itself; the issue stream is for unattended runs.
    if: failure() && github.event_name != 'pull_request'
    permissions:
      contents: read   # checkout, to use the local composite action
      issues: write
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: File or update the failure issue
        uses: ./.github/actions/file-failure-issue
        with:
          label: 'wf:canary'
          title: 'Weekly canary failed'
          token: ${{ github.token }}
