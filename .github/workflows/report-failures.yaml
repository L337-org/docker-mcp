name: 'Report failures'

# Posts a failed run of a workflow named below, started by one of the events below, to
# #docker-mcp, through the webhook in this repository's SLACK_WEBHOOK secret and the shared
# reporter pinned here (architecture/ci.md).  GitHub reads this trigger only from the default
# branch.
on:
  workflow_run:
    workflows:
      - 'Weekly canary'
      - 'CodeQL'
      - 'Build container images'
      - 'Check inbound changes'
      - 'Release'
    types: [completed]

permissions:
  # Both read by the shared reporter, which GitHub refuses to start without them: to name the
  # failed jobs and find a run that replaced a cancelled one, and to tell a tag from a branch.
  actions: read
  contents: read

jobs:
  slack:
    name: Report to Slack
    uses: L337-org/github-workflows/.github/workflows/slack-on-failure.yaml@PIN
    with:
      events: '["schedule", "push", "release"]'
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
