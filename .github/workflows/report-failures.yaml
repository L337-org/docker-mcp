name: 'Report failures'

# Posts a failed run of a workflow named below, started by one of the events below, to the
# project's Slack channel through the shared reporter (architecture/ci.md).  GitHub reads this
# trigger only from the default branch.
on:
  workflow_run:
    workflows:
      - 'Weekly canary'
      - 'CodeQL'
      - 'Code review'
      - 'Build container images'
      - 'Check inbound changes'
      - 'Release'
      - 'Announce pull requests'
    types: [completed]

permissions:
  # Both read by the shared reporter, which GitHub refuses to start without them: to name the
  # failed jobs and find a run that replaced a cancelled one, and to tell a tag from a branch.
  actions: read
  contents: read

jobs:
  slack:
    name: Report to Slack
    uses: L337-org/github-workflows/.github/workflows/slack-on-failure.yaml@v2
    with:
      channel: '#docker-mcp'
      events: '["schedule", "push", "release", "pull_request"]'
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
