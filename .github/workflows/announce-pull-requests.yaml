name: 'Announce pull requests'

# Posts a pull request that needs action to the project's Slack channel through the shared
# announcer, which decides what to post (architecture/ci.md).
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions: {}

jobs:
  slack:
    name: Announce to Slack
    uses: L337-org/github-workflows/.github/workflows/slack-on-pull-request.yaml@v2
    with:
      channel: '#docker-mcp'
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
