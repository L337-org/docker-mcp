name: 'Announce pull requests'

# Posts each pull request that needs action - opened or reopened and not a draft, or marked ready
# for review - to #docker-mcp, through the shared announcer at its v2 tag (architecture/ci.md).
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions: {}

jobs:
  slack:
    name: Announce to Slack
    uses: L337-org/github-workflows/.github/workflows/slack-on-pull-request.yaml@v2
    with:
      channel: '#docker-mcp'
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
