name: 'Check inbound changes'
permissions:
  contents: read

# Triggers. `push` is scoped to main only — PR branches are already covered by the
# `pull_request` trigger, so an unscoped `push` would double-run CI for every branch
# that has an open PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch); a push to main
# gets its own ref group so PR runs never cancel main's. Same shape codeql.yaml uses.
concurrency:
  group: premerge-${{ github.ref }}
  cancel-in-progress: true

# Jobs
jobs:

  action-pins:
    # Ported from L337-org/apt's job of the same name, which is the org's reference
    # implementation, and kept identical in logic to it and to send-to-influx's copy - three
    # repos carrying the same guard is only an advantage while they agree, and the
    # uppercase-SHA defect this arrives with the fix for was found in one copy and had to be
    # chased into the other two.
    #
    # Every ref here was already pinned when this job was added; it exists so that stays true
    # without anyone having to remember.
    runs-on: [ubuntu-latest]
    name: Action pins are immutable
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every `uses:` must name a 40-hex commit SHA
        run: |
          # A tag or branch ref can be repointed by the action's owner at any time, so
          # `@v7` means CI runs whatever that owner last pushed to it. That matters most in
          # publish.yaml, which mints an OIDC token for PyPI Trusted Publishing
          # (`id-token: write`), pushes to GHCR (`packages: write`) and uploads release
          # assets (`contents: write`) - a repointed tag would execute inside jobs holding
          # the strongest credentials this project has, and Trusted Publishing needs no
          # stored token for an attacker to steal in order to publish as this project.
          # First-party actions/* are not exempt: the standard makes no exception for them,
          # and the pin costs nothing to hold, because Dependabot bumps the SHA and rewrites
          # the trailing "# vX.Y.Z" comment. Local actions (./...) are exempt - they are
          # this repo's own code at this repo's own commit, so there is no third party to
          # repoint them.
          #
          # Quoting is optional in YAML, so `uses: "owner/action@<sha>"` is exactly as
          # pinned as the bare form, and hex is case-insensitive, so an uppercase SHA is
          # equally pinned - GitHub resolves one (verified: both the commits and tarball
          # API endpoints answer 200 for an upper-cased SHA). All are accepted: a guard
          # that fails a legitimately pinned action is one someone eventually switches
          # off wholesale, which costs more than it ever caught. In practice every pin
          # here is lowercase, because that is what Dependabot writes.
          #
          # The trailing "# vX.Y.Z" comment is a convention, not something this guard
          # enforces - the immutability of the ref is the security property, and the
          # comment only tells a human which tag the SHA was.
          bad=$(grep -rnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows .github/actions 2>/dev/null \
                | grep -vE "uses:[[:space:]]*[\"']?\./" \
                | grep -vE "uses:[[:space:]]*[\"']?[^[:space:]\"']+@[0-9a-fA-F]{40}[\"']?([[:space:]]|\$)" \
                || true)
          if [ -n "$bad" ]; then
            echo "::error::Every action must be pinned to a full 40-hex commit SHA." >&2
            printf '%s\n' "$bad" >&2
            exit 1
          fi
          echo "All action references are pinned to commit SHAs."

  fresh-resolve-import:
    # Answers a question `uv sync --locked` (used by every other job here) cannot: would a
    # CLEAN install of what we're about to ship actually import? `uv sync --locked` only ever
    # sees the pinned, known-good set recorded in uv.lock, never the set a fresh `uvx`/`pip
    # install` would resolve from the bare pyproject.toml specifiers today. mcp 2.0.0
    # (2026-07-28) proved the gap: it resolved cleanly against our then-uncapped `mcp>=1.27.1`
    # and removed `mcp.server.fastmcp`, so `import docker_mcp` died on every fresh install while
    # every uv.lock-pinned CI job here stayed green (see the mcp cap comment in pyproject.toml).
    # `uv pip install` is the pip-compatible interface — unlike `uv sync`, it never
    # reads or writes uv.lock, so it resolves purely from [project.dependencies].
    runs-on: [ubuntu-latest]
    name: Check fresh resolve still imports
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Resolve and install from pyproject.toml, ignoring uv.lock
        # A failure here is a resolve/build/install failure (an unsatisfiable specifier, a
        # sdist needing a toolchain we don't have, a transient fetch error) — distinct from
        # the import failure checked in the next step. The log above this line has the cause.
        run: |
          uv venv .venv-fresh
          if ! uv pip install --python .venv-fresh/bin/python . ; then
            echo "::error::Fresh resolve/install of pyproject.toml FAILED (see the uv output above for the cause) — this is a resolve/install failure, not an import failure."
            exit 1
          fi

      - name: Import the freshly-resolved install
        run: |
          if ! .venv-fresh/bin/python -c "import docker_mcp"; then
            echo "::error::pyproject.toml resolved fine, but 'import docker_mcp' FAILED against the freshly-resolved dependency set. An admitted dependency release broke our import surface (see the mcp 2.0.0 incident in CLAUDE.md) — tighten the offending dependency's cap."
            exit 1
          fi

      - name: Run the entry point against the freshly-resolved install
        # main() handles --version (print version, exit) before any daemon/network contact,
        # so this needs no Docker and catches a failure in main() itself, not just the import.
        run: .venv-fresh/bin/docker-mcp-server --version

  pytest-run:
    runs-on: [ubuntu-latest]
    name: Run pytest
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        # --locked fails if uv.lock disagrees with pyproject.toml instead of silently
        # re-locking — catches a lockfile-only dependency change (e.g. a Dependabot lock
        # rewrite that raises a cap pyproject still pins) that would otherwise pass CI.
        run: uv sync --all-groups --locked

      - name: Run pytest
        run: uv run pytest -v

  ruff-run:
    # Runs ruff lint + format checks. `uv run` (not `uvx`) so the ruff version is the
    # dev-group pin resolved through uv.lock — the same version pre-commit hooks run
    # locally — rather than a floating latest that can disagree with both.

    runs-on: [ubuntu-latest]

    name: Run ruff
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        # --locked fails if uv.lock disagrees with pyproject.toml instead of silently
        # re-locking — catches a lockfile-only dependency change (e.g. a Dependabot lock
        # rewrite that raises a cap pyproject still pins) that would otherwise pass CI.
        run: uv sync --all-groups --locked

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  pyright-run:
    # Type-checks with the pyright pin from the dev group ([tool.pyright] config in
    # pyproject.toml). Documented as a project convention; this job enforces it.
    runs-on: [ubuntu-latest]
    name: Run pyright
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        # --locked fails if uv.lock disagrees with pyproject.toml instead of silently
        # re-locking — catches a lockfile-only dependency change (e.g. a Dependabot lock
        # rewrite that raises a cap pyproject still pins) that would otherwise pass CI.
        run: uv sync --all-groups --locked

      - name: Run pyright
        run: uv run pyright

  mirror-check:
    # CLAUDE.md and .github/copilot-instructions.md are mirrors of each other (the same
    # rules written for an implementer and for a reviewer); architecture/ and
    # CONTRIBUTING.md hold the rule-level detail both point at. Together they are one
    # documentation set, so a change touching some but not all of it is worth a second
    # look. Ported from L337-org/send-to-influx's job of the same name, which extended
    # this repo's original two-file version for the detail layer both repos now have.
    #
    # Deliberately NOT a required status check, so the red X is a prompt to double-check
    # rather than a merge blocker — one-sided edits are legitimate and a blocker here
    # would eventually be switched off wholesale. Fork-safe: read-only, no secrets, plain
    # git diff (a PR-comment approach would need pull-requests:write, which fork PRs
    # don't get).
    runs-on: [ubuntu-latest]
    name: Check docs mirror
    if: github.event_name == 'pull_request'
    # 5-7s observed across recent PRs — a name-only diff. The ceiling is a backstop
    # against a hung checkout, not a performance budget.
    timeout-minutes: 5
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # need the merge-base with the PR base branch

      - name: Compare changes across CLAUDE.md, copilot-instructions.md and architecture/
        run: |
          base="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)"
          changed="$(git diff --name-only "$base" HEAD)"

          # -F throughout: an unanchored '.' in the copilot path would otherwise be a
          # wildcard, so '.github/copilot-instructions.md' would also match a path with
          # any character in that position. The fixed-string form is the same check
          # without that latent bug.
          #
          # The rule-carrying set is CURATED, not derived from what the instruction files
          # link to — they also link to README/SECURITY/PRIVACY/CODE_OF_CONDUCT/
          # MCP_VS_SKILLS, and a change to those implies nothing about the mirror. The
          # test for membership is whether the document carries a rule that would
          # otherwise live in an instruction file. architecture/ qualifies by
          # construction; CONTRIBUTING.md qualifies because it owns the new-tool-module
          # checklist and the testing conventions. Revisit this list whenever another
          # document starts carrying rules.
          claude=no; copilot=no; detail=no
          if grep -Fqx 'CLAUDE.md' <<<"$changed"; then claude=yes; fi
          if grep -Fqx '.github/copilot-instructions.md' <<<"$changed"; then copilot=yes; fi
          if grep -qE '^(architecture/|CONTRIBUTING\.md$)' <<<"$changed"; then detail=yes; fi

          echo "CLAUDE.md=$claude  copilot-instructions.md=$copilot  detail-layer=$detail"

          if [ "$claude" = no ] && [ "$copilot" = no ] && [ "$detail" = no ]; then
            echo "Docs mirror OK: this change touches none of the documentation set."
            exit 0
          fi
          if [ "$claude" = yes ] && [ "$copilot" = yes ] && [ "$detail" = yes ]; then
            echo "Docs mirror OK: the whole documentation set changed together."
            exit 0
          fi

          missing=""
          [ "$claude"  = no ] && missing="$missing CLAUDE.md"
          [ "$copilot" = no ] && missing="$missing .github/copilot-instructions.md"
          [ "$detail"  = no ] && missing="$missing architecture/ or CONTRIBUTING.md"

          echo "::error::MIRROR RULE: this PR changes part of the documentation set but not all of it. Untouched:${missing}. CLAUDE.md and .github/copilot-instructions.md carry the same rules for an implementer and a reviewer, and architecture/ plus CONTRIBUTING.md carry the rule-level detail they point at, so a rule that changed in one usually needs to reach the others. Legitimate one-sided edits exist — a detail-only architecture/ edit, a reviewer-only 'do not flag' entry, a typo — and this check is not required for merge, so say which it is in the PR description and carry on. Before mirroring, check the change belongs in an always-loaded file at all: if a CI test already enforces it, neither mirror should carry it."
          exit 1

  integration-tests:
    # Runs the suite gated by `-m integration` against the Docker daemon that
    # ships pre-installed on ubuntu-latest runners. Skipped if the unit tests
    # didn't pass — there's no point burning daemon time on a broken branch.
    runs-on: [ubuntu-latest]
    name: Run integration tests
    needs: [pytest-run]
    timeout-minutes: 20
    # The Hub-login step below gates on `env.DOCKERHUB_TOKEN`, which means the env
    # var needs to be resolved by the time the step `if:` is evaluated. Step-scoped
    # `env:` is set up too late for that, so we hoist the values to job-level env
    # (which IS resolved before any step `if:` runs). Referencing `secrets.*`
    # directly in the step `if:` is rejected at workflow-validation time with
    # "Unrecognized named-value: 'secrets'", so this hoist is the only working
    # shape for an opt-in-via-secret gate.
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        # --locked fails if uv.lock disagrees with pyproject.toml instead of silently
        # re-locking — catches a lockfile-only dependency change (e.g. a Dependabot lock
        # rewrite that raises a cap pyproject still pins) that would otherwise pass CI.
        run: uv sync --all-groups --locked

      - name: Verify Docker tooling on the runner
        # ubuntu-latest ships Docker Engine + docker CLI + compose v2 + buildx.
        # Scout is NOT pre-installed; tests skip cleanly via has_plugin().
        run: |
          docker version
          docker info | head -20
          docker compose version
          docker buildx version
          docker scout version 2>/dev/null || echo "scout not installed; scout integration tests will skip"

      - name: Initialize a single-node swarm
        # Needed for service_wait / node_wait integration tests (skip_if_no_swarm), which
        # otherwise skip cleanly on a non-swarm daemon. No teardown needed — the runner is
        # ephemeral and torn down after the job.
        run: docker swarm init

      - name: Optional Docker Hub login to dodge anonymous rate limits
        # Opt-in: set DOCKERHUB_USER / DOCKERHUB_TOKEN as repo secrets to authenticate.
        # Without them, the job runs anonymous and the existing skip-on-pull-failure
        # behaviour in the compose lifecycle test catches throttling.
        #
        # This `docker login` authenticates the *daemon/CLI*-backed tests (compose pulls,
        # etc.) by writing ~/.docker/config.json. It does NOT cover the registry HTTP tools
        # (registry_*), which hit registry-1.docker.io over httpx and authenticate only via
        # explicit args or the DOCKER_MCP_SERVER_REGISTRY_* env vars below — they never read
        # config.json. Both mechanisms are needed; don't drop one as redundant.
        if: ${{ env.DOCKERHUB_TOKEN != '' && env.DOCKERHUB_USER != '' }}
        run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USER" --password-stdin

      - name: Run integration tests
        # Authenticate the httpx-backed registry_* tools so their alpine manifest/config tests
        # don't 429 on Docker Hub's anonymous ~100-pull/6h-per-IP cap (CI runners share an
        # egress IP). The registry tools read these env vars (registry.py:_env_credentials);
        # unset (e.g. fork PRs, which get no secrets) → anonymous, and the skip-on-429 in
        # test_registry.py is the safety net.
        env:
          DOCKER_MCP_SERVER_REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USER }}
          DOCKER_MCP_SERVER_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: uv run pytest -m integration -v --tb=short
