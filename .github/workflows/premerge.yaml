name: 'Check inbound changes'
permissions:
  contents: read

# Triggers. `push` is scoped to main only — PR branches are already covered by the
# `pull_request` trigger, so an unscoped `push` would double-run CI for every branch
# that has an open PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch); a push to main
# gets its own ref group so PR runs never cancel main's. Same shape codeql.yaml uses.
concurrency:
  group: premerge-${{ github.ref }}
  cancel-in-progress: true

# Jobs
jobs:

  repo-hygiene:
    # Conventions every repository in this organisation shares, checked by the one copy in the
    # shared workflows repository at the commit pinned here.
    runs-on: [ubuntu-latest]
    name: Repository hygiene
    # 9s for the whole job on the first run of the shared action here, uv setup included.
    timeout-minutes: 5
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Repository conventions hold
        uses: L337-org/github-workflows/actions/repo-hygiene@68eac351110ef94d36c0b98cec08339cd22c7ab7 # v1.2.0

  action-pins:
    # Every `uses:` in .github/workflows and .github/actions names a full commit SHA, checked by
    # the shared copy pinned here.  Its default directories are this repository's, so the local
    # file-failure-issue action is covered too.  Why the pin matters most here: publish.yaml
    # mints an OIDC token for PyPI Trusted Publishing (`id-token: write`), pushes to GHCR
    # (`packages: write`) and uploads release assets (`contents: write`), so a repointed tag
    # would execute inside the jobs holding this project's strongest credentials.
    runs-on: [ubuntu-latest]
    name: Action pins are immutable
    # 5s for the whole job on the first run of the shared action here - a grep over the workflows.
    timeout-minutes: 5
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every `uses:` must name a 40-hex commit SHA
        uses: L337-org/github-workflows/actions/action-pins@68eac351110ef94d36c0b98cec08339cd22c7ab7 # v1.2.0

  fresh-resolve-import:
    # Answers a question `uv sync --locked` (used by every other job here) cannot: would a
    # CLEAN install of what we're about to ship actually import? `uv sync --locked` only ever
    # sees the pinned, known-good set recorded in uv.lock, never the set a fresh `uvx`/`pip
    # install` would resolve from the bare pyproject.toml specifiers today. mcp 2.0.0
    # (2026-07-28) proved the gap: it resolved cleanly against our then-uncapped `mcp>=1.27.1`
    # and removed `mcp.server.fastmcp`, so `import docker_mcp` died on every fresh install while
    # every uv.lock-pinned CI job here stayed green (see the mcp cap comment in pyproject.toml).
    # `uv pip install` is the pip-compatible interface — unlike `uv sync`, it never
    # reads or writes uv.lock, so it resolves purely from [project.dependencies].
    runs-on: [ubuntu-latest]
    name: Check fresh resolve still imports
    # 18s observed max. Roomier than its runtime needs: it is the one premerge job that
    # resolves against the live index, so a slow PyPI is a plausible stall.
    timeout-minutes: 10
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Resolve and install from pyproject.toml, ignoring uv.lock
        # A failure here is a resolve/build/install failure (an unsatisfiable specifier, a
        # sdist needing a toolchain we don't have, a transient fetch error) — distinct from
        # the import failure checked in the next step. The log above this line has the cause.
        run: |
          uv venv .venv-fresh
          if ! uv pip install --python .venv-fresh/bin/python . ; then
            echo "::error::Fresh resolve/install of pyproject.toml FAILED (see the uv output above for the cause) — this is a resolve/install failure, not an import failure."
            exit 1
          fi

      - name: Import the freshly-resolved install
        run: |
          if ! .venv-fresh/bin/python -c "import docker_mcp"; then
            echo "::error::pyproject.toml resolved fine, but 'import docker_mcp' FAILED against the freshly-resolved dependency set. An admitted dependency release broke our import surface (see the mcp 2.0.0 incident in architecture/ci.md) — tighten the offending dependency's cap."
            exit 1
          fi

      - name: Run the entry point against the freshly-resolved install
        # main() handles --version (print version, exit) before any daemon/network contact,
        # so this needs no Docker and catches a failure in main() itself, not just the import.
        run: .venv-fresh/bin/docker-mcp-server --version

  claude-plugin-rehearsal-build:
    # Rehearses the release's Claude plugin jobs (publish.yaml) with the same script, so a change
    # that would break them fails here rather than after a release has gone to PyPI.  The one
    # difference is the source: this version is not on PyPI yet, so the plugin is locked against a
    # wheel built from this checkout.  Everything else - the folder and lock checks, `claude plugin
    # validate --strict`, and the publish decision (dry run, against the live branch) - is the
    # release's own code path.
    runs-on: [ubuntu-latest]
    name: Claude plugin rehearsal (build)
    # A wheel build, a lock and a validate.
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # The release jobs' uv, so the rehearsal locks with the same version.
          version: "0.11.21"
          enable-cache: false

      - name: Install the Claude Code CLI for `claude plugin validate`
        # The same pin as publish.yaml's claude-plugin-build job.
        run: npm install --global @anthropic-ai/claude-code@2.1.292

      - name: Build the server wheel from this checkout
        run: uv build --out-dir local-dist

      - name: Build and check the plugin against it
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/claude_plugin_release.py build --version "$version" --source local --dist local-dist --out plugin-build
          # What publishing this version after release would do to the live branch, changing nothing.
          python scripts/claude_plugin_release.py publish --version "$version" --build plugin-build --dry-run

      - name: Keep the build for the smoke jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-plugin-rehearsal-build
          path: plugin-build/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  claude-plugin-rehearsal-smoke:
    # The release's smoke test on each OS, against the rehearsal build: both installs, both report
    # the version, the same tools registered, and the plugin's settings take effect.
    runs-on: ${{ matrix.os }}
    name: Claude plugin rehearsal (smoke, ${{ matrix.os }})
    # Two installs and a server session for each settings case.
    timeout-minutes: 30
    needs: [claude-plugin-rehearsal-build]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.21"
          enable-cache: false

      - name: Fetch the rehearsal build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: claude-plugin-rehearsal-build
          path: plugin-build

      - name: Install and exercise the plugin
        run: python scripts/claude_plugin_release.py smoke --build plugin-build ${{ matrix.os == 'ubuntu-latest' && '--docker' || '' }}

  pytest-run:
    runs-on: [ubuntu-latest]
    name: Run pytest
    # 124s observed max.
    timeout-minutes: 15
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        # --locked fails if uv.lock disagrees with pyproject.toml instead of silently
        # re-locking — catches a lockfile-only dependency change (e.g. a Dependabot lock
        # rewrite that raises a cap pyproject still pins) that would otherwise pass CI.
        run: uv sync --all-groups --locked

      - name: Run pytest
        run: uv run pytest -v

  ruff-run:
    # Runs ruff lint + format checks. `uv run` (not `uvx`) so the ruff version is the
    # dev-group pin resolved through uv.lock — the same version pre-commit hooks run
    # locally — rather than a floating latest that can disagree with both.

    runs-on: [ubuntu-latest]

    name: Run ruff
    # 15s observed max.
    timeout-minutes: 5
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        # --locked fails if uv.lock disagrees with pyproject.toml instead of silently
        # re-locking — catches a lockfile-only dependency change (e.g. a Dependabot lock
        # rewrite that raises a cap pyproject still pins) that would otherwise pass CI.
        run: uv sync --all-groups --locked

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  pydoclint-run:
    # Checks that each docstring agrees with its signature. ruff's D rules cannot: D417 only
    # checks the parameters of a section a docstring already has, so a function documenting none
    # of them passes clean. Config and the two per-function exemptions live in
    # [tool.pydoclint] in pyproject.toml; tests/test_docstrings.py asserts the exemptions.
    runs-on: [ubuntu-latest]
    name: Run pydoclint
    # 4s observed max.
    timeout-minutes: 5
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Run pydoclint
        # `docker_mcp` explicitly, not `.`: tests/ is exempt for the same reason ruff exempts it
        # from D, and scripts/ is outside the run too. Passing a path rather than an --exclude
        # regex is deliberate - an unanchored `build` in such a regex silently matched
        # tools/buildx.py, so a whole module went unchecked while the run reported clean.
        run: uv run pydoclint docker_mcp

  pyright-run:
    # Type-checks with the pyright pin from the dev group ([tool.pyright] config in
    # pyproject.toml). Documented as a project convention; this job enforces it.
    runs-on: [ubuntu-latest]
    name: Run pyright
    # 22s observed max. Roomier than that: the pyright package pulls a node runtime on
    # first use, so a cold run is network-bound.
    timeout-minutes: 10
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        # --locked fails if uv.lock disagrees with pyproject.toml instead of silently
        # re-locking — catches a lockfile-only dependency change (e.g. a Dependabot lock
        # rewrite that raises a cap pyproject still pins) that would otherwise pass CI.
        run: uv sync --all-groups --locked

      - name: Run pyright
        run: uv run pyright

  integration-tests:
    # Runs the suite gated by `-m integration` against the Docker daemon that
    # ships pre-installed on ubuntu-latest runners. Skipped if the unit tests
    # didn't pass — there's no point burning daemon time on a broken branch.
    runs-on: [ubuntu-latest]
    name: Run integration tests
    needs: [pytest-run]
    timeout-minutes: 20
    # The Hub-login step below gates on `env.DOCKERHUB_TOKEN`, which means the env
    # var needs to be resolved by the time the step `if:` is evaluated. Step-scoped
    # `env:` is set up too late for that, so we hoist the values to job-level env
    # (which IS resolved before any step `if:` runs). Referencing `secrets.*`
    # directly in the step `if:` is rejected at workflow-validation time with
    # "Unrecognized named-value: 'secrets'", so this hoist is the only working
    # shape for an opt-in-via-secret gate.
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Check out source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        # --locked fails if uv.lock disagrees with pyproject.toml instead of silently
        # re-locking — catches a lockfile-only dependency change (e.g. a Dependabot lock
        # rewrite that raises a cap pyproject still pins) that would otherwise pass CI.
        run: uv sync --all-groups --locked

      - name: Verify Docker tooling on the runner
        # ubuntu-latest ships Docker Engine + docker CLI + compose v2 + buildx.
        # Scout is NOT pre-installed; tests skip cleanly via has_plugin().
        run: |
          docker version
          docker info | head -20
          docker compose version
          docker buildx version
          docker scout version 2>/dev/null || echo "scout not installed; scout integration tests will skip"

      - name: Initialize a single-node swarm
        # Needed for service_wait / node_wait integration tests (skip_if_no_swarm), which
        # otherwise skip cleanly on a non-swarm daemon. No teardown needed — the runner is
        # ephemeral and torn down after the job.
        run: docker swarm init

      - name: Optional Docker Hub login to dodge anonymous rate limits
        # Opt-in: set DOCKERHUB_USER / DOCKERHUB_TOKEN as repo secrets to authenticate.
        # Without them, the job runs anonymous and the existing skip-on-pull-failure
        # behaviour in the compose lifecycle test catches throttling.
        #
        # This `docker login` authenticates the *daemon/CLI*-backed tests (compose pulls,
        # etc.) by writing ~/.docker/config.json. It does NOT cover the registry HTTP tools
        # (registry_*), which hit registry-1.docker.io over httpx and authenticate only via
        # explicit args or the DOCKER_MCP_SERVER_REGISTRY_* env vars below — they never read
        # config.json. Both mechanisms are needed; don't drop one as redundant.
        if: ${{ env.DOCKERHUB_TOKEN != '' && env.DOCKERHUB_USER != '' }}
        run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USER" --password-stdin

      - name: Run integration tests
        # Authenticate the httpx-backed registry_* tools so their alpine manifest/config tests
        # don't 429 on Docker Hub's anonymous ~100-pull/6h-per-IP cap (CI runners share an
        # egress IP). The registry tools read these env vars (registry.py:_env_credentials);
        # unset (e.g. fork PRs, which get no secrets) → anonymous, and the skip-on-429 in
        # test_registry.py is the safety net.
        env:
          DOCKER_MCP_SERVER_REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USER }}
          DOCKER_MCP_SERVER_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: uv run pytest -m integration -v --tb=short
